components:
  schemas:
    Account:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        displayName:
          type: string
        email:
          format: email
          type:
            - string
            - "null"
        hasPassword:
          type: boolean
        id:
          format: uuid
          type: string
        identities:
          description: Linked sign-in providers
          items:
            enum:
              - google
              - discord
            type: string
          type: array
        instanceRole:
          enum:
            - owner
            - admin
            - member
          type: string
        lastLoginAt:
          format: date-time
          type:
            - string
            - "null"
        status:
          enum:
            - active
            - disabled
          type: string
        updatedAt:
          format: date-time
          type: string
        username:
          type: string
      required:
        - id
        - username
        - displayName
        - instanceRole
        - hasPassword
        - identities
        - status
        - createdAt
        - updatedAt
      type: object
    AccountCreate:
      additionalProperties: false
      properties:
        displayName:
          maxLength: 100
          type: string
        email:
          format: email
          type: string
        instanceRole:
          default: member
          enum:
            - admin
            - member
          type: string
        password:
          maxLength: 256
          minLength: 12
          type: string
          writeOnly: true
        username:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{1,38}[A-Za-z0-9]$
          type: string
      required:
        - username
      type: object
    AccountPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Account"
          type: array
        nextCursor:
          type:
            - string
            - "null"
      required:
        - items
      type: object
    AccountUpdate:
      additionalProperties: false
      properties:
        displayName:
          maxLength: 100
          type: string
        email:
          format: email
          type:
            - string
            - "null"
        instanceRole:
          enum:
            - owner
            - admin
            - member
          type: string
        status:
          enum:
            - active
            - disabled
          type: string
      type: object
    Area:
      additionalProperties: false
      properties:
        cidr:
          type:
            - string
            - "null"
        color:
          enum:
            - yellow
            - teal
            - violet
            - rose
            - blue
            - green
            - gray
          type: string
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        health:
          type: string
        id:
          format: uuid
          type: string
        kind:
          enum:
            - site
            - network
            - vlan
            - cloud
            - custom
          type: string
        name:
          maxLength: 100
          type: string
        nodeCount:
          format: int64
          type: integer
        parentId:
          type: string
        properties:
          items:
            $ref: "#/components/schemas/Field"
          type: array
        updatedAt:
          format: date-time
          type: string
        version:
          format: int32
          type: integer
        vlanId:
          format: int32
          type:
            - integer
            - "null"
      required:
        - id
        - parentId
        - name
        - kind
        - description
        - properties
        - createdAt
        - updatedAt
        - version
      type: object
    AreaPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Area"
          type: array
        nextCursor:
          type: string
      required:
        - items
      type: object
    AuthProviders:
      additionalProperties: false
      properties:
        password:
          type: boolean
        providers:
          items:
            $ref: "#/components/schemas/ProviderOption"
          type: array
      required:
        - password
        - providers
      type: object
    CanvasGrants:
      additionalProperties: false
      properties:
        canvasIds:
          items:
            type: string
          type: array
      required:
        - canvasIds
      type: object
    Field:
      additionalProperties: false
      properties:
        key:
          pattern: ^[a-z][a-z0-9_]{0,39}$
          type: string
        label:
          maxLength: 60
          type: string
        redacted:
          type: boolean
        sensitive:
          type: boolean
        value:
          maxLength: 2000
          type: string
      required:
        - key
        - label
      type: object
    Health:
      additionalProperties: false
      properties:
        checkedAt:
          format: date-time
          type: string
        message:
          type: string
        source:
          enum:
            - manual
            - plugin
          type: string
        status:
          enum:
            - healthy
            - degraded
            - down
            - unknown
          type: string
      required:
        - status
        - source
      type: object
    Identity:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        displayName:
          type:
            - string
            - "null"
        email:
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        lastUsedAt:
          format: date-time
          type:
            - string
            - "null"
        provider:
          enum:
            - google
            - discord
          type: string
      required:
        - id
        - provider
        - createdAt
      type: object
    InstanceSettings:
      additionalProperties: false
      properties:
        oauthAutoLinkByEmail:
          default: true
          type:
            - boolean
            - "null"
        sessionTtlHours:
          default: 168
          format: int64
          maximum: 8760
          minimum: 1
          type:
            - integer
            - "null"
      type: object
    Link:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        directed:
          type: boolean
        health:
          $ref: "#/components/schemas/Health"
        id:
          format: uuid
          type: string
        kind:
          enum:
            - physical
            - vpn_tunnel
            - proxy_route
            - dns_dependency
            - storage_mount
            - logical
          type: string
        label:
          type: string
        properties:
          items:
            $ref: "#/components/schemas/Field"
          type: array
        sourceNodeId:
          format: uuid
          type: string
        sourcePort:
          type: string
        targetNodeId:
          format: uuid
          type: string
        targetPort:
          type: string
        updatedAt:
          format: date-time
          type: string
        version:
          format: int32
          type: integer
      required:
        - id
        - sourceNodeId
        - targetNodeId
        - kind
        - directed
        - label
        - properties
        - health
        - createdAt
        - updatedAt
        - version
      type: object
    LinkPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Link"
          type: array
        nextCursor:
          type: string
      required:
        - items
      type: object
    ListMyIdentitiesOutputBody:
      additionalProperties: false
      properties:
        hasPassword:
          type: boolean
        items:
          items:
            $ref: "#/components/schemas/Identity"
          type: array
      required:
        - items
        - hasPassword
      type: object
    LoginRequest:
      additionalProperties: false
      properties:
        password:
          type: string
          writeOnly: true
        remember:
          default: false
          type: boolean
        username:
          type: string
      required:
        - username
        - password
      type: object
    MeUpdate:
      additionalProperties: false
      properties:
        displayName:
          maxLength: 100
          type: string
        email:
          format: email
          type:
            - string
            - "null"
      type: object
    Member:
      additionalProperties: false
      properties:
        canViewSensitive:
          type: boolean
        canvasIds:
          items:
            type: string
          type: array
        createdAt:
          format: date-time
          type: string
        role:
          enum:
            - owner
            - admin
            - editor
            - viewer
          type: string
        user:
          $ref: "#/components/schemas/PublicUser"
      required:
        - user
        - role
      type: object
    MemberAdd:
      additionalProperties: false
      properties:
        canViewSensitive:
          default: false
          type: boolean
        canvasIds:
          items:
            type: string
          type: array
        role:
          enum:
            - owner
            - admin
            - editor
            - viewer
          type: string
        userId:
          format: uuid
          type: string
      required:
        - userId
        - role
      type: object
    MemberPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Member"
          type: array
      required:
        - items
      type: object
    MemberUpdate:
      additionalProperties: false
      properties:
        canViewSensitive:
          type: boolean
        role:
          enum:
            - owner
            - admin
            - editor
            - viewer
          type: string
      type: object
    Membership:
      additionalProperties: false
      properties:
        canViewSensitive:
          type: boolean
        role:
          enum:
            - owner
            - admin
            - editor
            - viewer
          type: string
      required:
        - role
        - canViewSensitive
      type: object
    Node:
      additionalProperties: false
      properties:
        areaId:
          type: string
        category:
          enum:
            - network
            - compute
            - service
            - storage
            - external
            - generic
          type: string
        createdAt:
          format: date-time
          type: string
        createdBy:
          type: string
        description:
          type: string
        health:
          $ref: "#/components/schemas/Health"
        icon:
          type: string
        id:
          format: uuid
          type: string
        isProtected:
          type: boolean
        name:
          maxLength: 100
          type: string
        properties:
          items:
            $ref: "#/components/schemas/Field"
          type: array
        slug:
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          type: string
        type:
          type: string
        updatedAt:
          format: date-time
          type: string
        version:
          format: int32
          type: integer
      required:
        - id
        - slug
        - name
        - category
        - type
        - description
        - areaId
        - properties
        - health
        - isProtected
        - createdAt
        - updatedAt
        - version
      type: object
    NodePage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Node"
          type: array
        nextCursor:
          type: string
      required:
        - items
      type: object
    NodeUsage:
      additionalProperties: false
      properties:
        canvases:
          items:
            $ref: "#/components/schemas/NodeUsageCanvas"
          type: array
        hiddenCanvasCount:
          format: int64
          type: integer
        linkCount:
          format: int64
          type: integer
        noteCount:
          format: int64
          type: integer
      required:
        - canvases
        - hiddenCanvasCount
        - linkCount
        - noteCount
      type: object
    NodeUsageCanvas:
      additionalProperties: false
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
      required:
        - id
        - name
      type: object
    Note:
      additionalProperties: false
      properties:
        body:
          type: string
        color:
          enum:
            - default
            - yellow
            - teal
            - violet
            - rose
          type: string
        createdAt:
          format: date-time
          type: string
        createdBy:
          type: string
        id:
          format: uuid
          type: string
        isSensitive:
          type: boolean
        kind:
          enum:
            - note
            - rule
          type: string
        redacted:
          type: boolean
        target:
          $ref: "#/components/schemas/NoteTarget"
        title:
          maxLength: 200
          type: string
        updatedAt:
          format: date-time
          type: string
        updatedBy:
          type: string
        version:
          format: int32
          type: integer
      required:
        - id
        - target
        - kind
        - title
        - body
        - isSensitive
        - color
        - createdAt
        - updatedAt
        - version
      type: object
    NotePage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Note"
          type: array
        nextCursor:
          type: string
      required:
        - items
      type: object
    NoteTarget:
      additionalProperties: false
      properties:
        id:
          type: string
        type:
          enum:
            - node
            - link
            - area
            - canvas
            - workspace
          type: string
      required:
        - type
      type: object
    Page:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Workspace"
          type: array
      required:
        - items
      type: object
    PasswordChange:
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          writeOnly: true
        newPassword:
          maxLength: 256
          minLength: 12
          type: string
          writeOnly: true
      required:
        - currentPassword
        - newPassword
      type: object
    PasswordReset:
      additionalProperties: false
      properties:
        newPassword:
          maxLength: 256
          minLength: 12
          type: string
          writeOnly: true
      required:
        - newPassword
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable reason
          type: string
        detail:
          type: string
        errors:
          description: Field-level validation errors
          items:
            $ref: "#/components/schemas/ProblemField"
          type: array
        instance:
          type: string
        status:
          format: int64
          type: integer
        title:
          type: string
        type:
          default: about:blank
          format: uri
          type: string
      required:
        - title
        - status
        - code
      type: object
    ProblemField:
      additionalProperties: false
      properties:
        location:
          type: string
        message:
          type: string
        value: {}
      required:
        - message
      type: object
    ProviderOption:
      additionalProperties: false
      properties:
        id:
          enum:
            - google
            - discord
          type: string
        name:
          type: string
      required:
        - id
        - name
      type: object
    PublicUser:
      additionalProperties: false
      properties:
        displayName:
          type: string
        id:
          format: uuid
          type: string
        username:
          type: string
      required:
        - id
        - username
        - displayName
      type: object
    SetupRequest:
      additionalProperties: false
      properties:
        displayName:
          maxLength: 100
          type: string
        email:
          format: email
          type: string
        password:
          maxLength: 256
          minLength: 12
          type: string
          writeOnly: true
        username:
          examples:
            - alice
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{1,38}[A-Za-z0-9]$
          type: string
        workspaceName:
          description: If set, also create this first workspace with you as owner
          maxLength: 100
          type: string
      required:
        - username
        - password
      type: object
    SetupStatus:
      additionalProperties: false
      properties:
        needsSetup:
          type: boolean
      required:
        - needsSetup
      type: object
    User:
      additionalProperties: false
      properties:
        displayName:
          type: string
        id:
          format: uuid
          type: string
        username:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{1,38}[A-Za-z0-9]$
          type: string
      required:
        - id
        - username
        - displayName
      type: object
    Workspace:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        id:
          format: uuid
          type: string
        isProtected:
          type: boolean
        membership:
          $ref: "#/components/schemas/Membership"
        name:
          maxLength: 100
          type: string
        settings:
          additionalProperties: {}
          type: object
        slug:
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          type: string
        updatedAt:
          format: date-time
          type: string
        version:
          format: int32
          type: integer
      required:
        - id
        - name
        - slug
        - description
        - isProtected
        - settings
        - membership
        - createdAt
        - updatedAt
        - version
      type: object
    WorkspaceCreate:
      additionalProperties: false
      properties:
        description:
          type: string
        name:
          maxLength: 100
          minLength: 1
          type: string
        slug:
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          type: string
      required:
        - name
      type: object
    WorkspaceUpdate:
      additionalProperties: false
      properties:
        description:
          type: string
        isProtected:
          type: boolean
        name:
          maxLength: 100
          minLength: 1
          type: string
        settings:
          additionalProperties: {}
          type: object
        slug:
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          type: string
      type: object
  securitySchemes:
    guest:
      description: Set by `POST /share/{token}/unlock`. Valid for one share link only.
      in: cookie
      name: netopology_share
      type: apiKey
    session:
      description: Set by login/setup. HttpOnly, Secure, SameSite=Lax.
      in: cookie
      name: netopology_session
      type: apiKey
info:
  description: "Draw, understand and operate your whole infrastructure. Contract: api/contract.yaml."
  license:
    identifier: Apache-2.0
    name: Apache-2.0
  title: Netopology API
  version: 0.1.0-dev
openapi: 3.1.0
paths:
  /auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security: []
      summary: Sign in
      tags:
        - Setup & auth
      x-permission: auth.login
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Sign out (ends the current session)
      tags:
        - Setup & auth
      x-permission: auth.logout
  /auth/oauth/{provider}/callback:
    get:
      description: Signs in only if the identity is linked to an existing account, or if an account's email matches the provider-**verified** email and has no identity for this provider yet (it is then linked). Never creates an account. On failure redirects to the sign-in page with `?error=identity_not_linked` (or another `code`). Also completes `me.identity_link` flows.
      operationId: finishOAuthSignIn
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            enum:
              - google
              - discord
            type: string
        - explode: false
          in: query
          name: code
          schema:
            type: string
        - explode: false
          in: query
          name: state
          schema:
            type: string
        - explode: false
          in: query
          name: error
          schema:
            type: string
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security: []
      summary: Provider redirects back here
      tags:
        - Setup & auth
      x-permission: auth.oauth_callback
  /auth/oauth/{provider}/start:
    get:
      operationId: startOAuthSignIn
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            enum:
              - google
              - discord
            type: string
        - explode: false
          in: query
          name: returnTo
          schema:
            default: /
            type: string
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security: []
      summary: Begin Google/Discord sign-in (browser redirect)
      tags:
        - Setup & auth
      x-permission: auth.oauth_start
  /auth/providers:
    get:
      description: Google and Discord appear only when the server has OAuth client credentials configured.
      operationId: listAuthProviders
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviders"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security: []
      summary: Which sign-in methods are enabled
      tags:
        - Setup & auth
      x-permission: auth.providers
  /instance/settings:
    get:
      operationId: getInstanceSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettings"
          description: OK
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Get server settings
      tags:
        - Instance
      x-permission: instance.settings_read
    patch:
      operationId: updateInstanceSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceSettings"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettings"
          description: OK
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Update server settings
      tags:
        - Instance
      x-permission: instance.settings_update
  /me:
    get:
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Get the signed-in account
      tags:
        - Me
      x-permission: me.read
    patch:
