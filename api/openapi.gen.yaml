components:
  schemas:
    Account:
      properties:
        createdAt:
          format: date-time
          type: string
        displayName:
          type: string
        email:
          format: email
          type:
            - string
            - "null"
        hasPassword:
          type: boolean
        id:
          format: uuid
          type: string
        identities:
          description: Linked sign-in providers
          items:
            enum:
              - google
              - discord
            type: string
          type: array
        instanceRole:
          enum:
            - owner
            - admin
            - member
          type: string
        lastLoginAt:
          format: date-time
          type:
            - string
            - "null"
        status:
          enum:
            - active
            - disabled
          type: string
        updatedAt:
          format: date-time
          type: string
        username:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{1,38}[A-Za-z0-9]$
          type: string
      required:
        - id
        - username
        - displayName
        - instanceRole
        - hasPassword
        - identities
        - status
        - createdAt
        - updatedAt
      type: object
    AccountCreate:
      anyOf:
        - required:
            - password
        - required:
            - email
      properties:
        displayName:
          maxLength: 100
          type: string
        email:
          format: email
          type: string
        instanceRole:
          default: member
          enum:
            - admin
            - member
          type: string
        password:
          maxLength: 256
          minLength: 12
          type: string
          writeOnly: true
        username:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{1,38}[A-Za-z0-9]$
          type: string
      required:
        - username
      type: object
    AccountPage:
      properties:
        items:
          items:
            $ref: "#/components/schemas/Account"
          type: array
        nextCursor:
          type:
            - string
            - "null"
      required:
        - items
      type: object
    AccountUpdate:
      minProperties: 1
      properties:
        displayName:
          maxLength: 100
          type: string
        email:
          format: email
          type:
            - string
            - "null"
        instanceRole:
          enum:
            - owner
            - admin
            - member
          type: string
        status:
          enum:
            - active
            - disabled
          type: string
      type: object
    Actor:
      properties:
        displayName:
          type:
            - string
            - "null"
        id:
          format: uuid
          type:
            - string
            - "null"
        type:
          enum:
            - user
            - share_link
            - system
            - workflow
          type: string
      required:
        - type
      type: object
    Area:
      properties:
        cidr:
          type:
            - string
            - "null"
        color:
          default: yellow
          enum:
            - yellow
            - teal
            - violet
            - rose
            - blue
            - green
            - gray
          type: string
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        health:
          enum:
            - healthy
            - degraded
            - down
            - unknown
          readOnly: true
          type: string
        id:
          format: uuid
          type: string
        kind:
          enum:
            - site
            - network
            - vlan
            - cloud
            - custom
          type: string
        name:
          maxLength: 100
          type: string
        nodeCount:
          format: int64
          readOnly: true
          type: integer
        parentId:
          format: uuid
          type:
            - string
            - "null"
        properties:
          items:
            $ref: "#/components/schemas/Field"
          type: array
        updatedAt:
          format: date-time
          type: string
        version:
          $ref: "#/components/schemas/Version"
        vlanId:
          format: int32
          maximum: 4094
          minimum: 1
          type:
            - integer
            - "null"
      required:
        - id
        - parentId
        - name
        - kind
        - description
        - properties
        - createdAt
        - updatedAt
        - version
      type: object
    AreaColor:
      default: yellow
      enum:
        - yellow
        - teal
        - violet
        - rose
        - blue
        - green
        - gray
      type: string
    AreaCreate:
      properties:
        cidr:
          type: string
        color:
          default: yellow
          enum:
            - yellow
            - teal
            - violet
            - rose
            - blue
            - green
            - gray
          type: string
        description:
          type: string
        kind:
          enum:
            - site
            - network
            - vlan
            - cloud
            - custom
          type: string
        name:
          maxLength: 100
          minLength: 1
          type: string
        parentId:
          format: uuid
          type: string
        placeOn:
          $ref: "#/components/schemas/PlaceOn"
        properties:
          items:
            $ref: "#/components/schemas/Field"
          type: array
        vlanId:
          format: int32
          maximum: 4094
          minimum: 1
          type: integer
      required:
        - name
      type: object
    AreaKind:
      enum:
        - site
        - network
        - vlan
        - cloud
        - custom
      type: string
    AreaPage:
      properties:
        items:
          items:
            $ref: "#/components/schemas/Area"
          type: array
        nextCursor:
          type:
            - string
            - "null"
      required:
        - items
      type: object
    AreaUpdate:
      minProperties: 1
      properties:
        cidr:
          type:
            - string
            - "null"
        color:
          default: yellow
          enum:
            - yellow
            - teal
            - violet
            - rose
            - blue
            - green
            - gray
          type: string
        description:
          type: string
        kind:
          enum:
            - site
            - network
            - vlan
            - cloud
            - custom
          type: string
        name:
          maxLength: 100
          minLength: 1
          type: string
        parentId:
          format: uuid
          type:
            - string
            - "null"
        properties:
          items:
            $ref: "#/components/schemas/Field"
          type: array
        vlanId:
          format: int32
          maximum: 4094
          minimum: 1
          type:
            - integer
            - "null"
      type: object
    AuditEntry:
      properties:
        action:
          type: string
        actor:
          $ref: "#/components/schemas/Actor"
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        ip:
          type:
            - string
            - "null"
        metadata:
          additionalProperties: {}
          type: object
        target:
          oneOf:
            - $ref: "#/components/schemas/Target"
            - type: "null"
      required:
        - id
        - actor
        - action
        - metadata
        - createdAt
      type: object
    AuditPage:
      properties:
        items:
          items:
            $ref: "#/components/schemas/AuditEntry"
          type: array
        nextCursor:
          type:
            - string
            - "null"
      required:
        - items
      type: object
    AuthProvider:
      enum:
        - google
        - discord
      type: string
    AuthProviders:
      properties:
        password:
          type: boolean
        providers:
          items:
            $ref: "#/components/schemas/ProviderOption"
          type: array
      required:
        - password
        - providers
      type: object
    BreadcrumbItem:
      properties:
        areaId:
          format: uuid
          type:
            - string
            - "null"
        canvasId:
          format: uuid
          type: string
        name:
          type: string
      required:
        - name
        - canvasId
      type: object
    Canvas:
      properties:
        areaId:
          format: uuid
          type:
            - string
            - "null"
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        id:
          format: uuid
          type: string
        isProtected:
          type: boolean
        kind:
          enum:
            - tab
            - area
          type: string
        lock:
          oneOf:
            - $ref: "#/components/schemas/CanvasLock"
            - type: "null"
        name:
          maxLength: 100
          type: string
        settings:
          additionalProperties: true
          properties:
            grid:
              default: true
              type: boolean
            hiddenLinkKinds:
              items:
                enum:
                  - physical
                  - logical
                  - vpn_tunnel
                  - proxy_route
                  - dns_dependency
                  - storage_mount
                type: string
              type: array
              uniqueItems: true
            showHealth:
              default: true
              type: boolean
            snap:
              default: 16
              minimum: 0
              type: integer
          type: object
        sortOrder:
          format: int32
          type: integer
        updatedAt:
          format: date-time
          type: string
        version:
          $ref: "#/components/schemas/Version"
        viewport:
          $ref: "#/components/schemas/CanvasViewport"
      required:
        - id
        - kind
        - areaId
        - name
        - description
        - sortOrder
        - viewport
        - settings
        - isProtected
        - lock
        - createdAt
        - updatedAt
        - version
      type: object
    CanvasCreate:
      properties:
        description:
          type: string
        isProtected:
          default: false
          type: boolean
        name:
          maxLength: 100
          minLength: 1
          type: string
        settings:
          additionalProperties: true
          properties:
            grid:
              default: true
              type: boolean
            hiddenLinkKinds:
              items:
                enum:
                  - physical
                  - logical
                  - vpn_tunnel
                  - proxy_route
                  - dns_dependency
                  - storage_mount
                type: string
              type: array
              uniqueItems: true
            showHealth:
              default: true
              type: boolean
            snap:
              default: 16
              minimum: 0
              type: integer
          type: object
        sortOrder:
          format: int32
          type: integer
      required:
        - name
      type: object
    CanvasGrants:
      properties:
        canvasIds:
          items:
            format: uuid
            type: string
          type: array
          uniqueItems: true
      required:
        - canvasIds
      type: object
    CanvasLock:
      properties:
        lockedAt:
          format: date-time
          type: string
        userId:
          format: uuid
          type: string
      required:
        - userId
        - lockedAt
      type: object
    CanvasOperation:
      discriminator:
        mapping:
          link.override: "#/components/schemas/OpLinkOverride"
          link.reset: "#/components/schemas/OpLinkReset"
          place: "#/components/schemas/OpPlace"
          remove: "#/components/schemas/OpRemovePlacement"
          shape.create: "#/components/schemas/OpCreateShape"
          shape.delete: "#/components/schemas/OpDeleteShape"
          shape.update: "#/components/schemas/OpUpdateShape"
          update: "#/components/schemas/OpUpdatePlacement"
        propertyName: op
      oneOf:
        - $ref: "#/components/schemas/OpPlace"
        - $ref: "#/components/schemas/OpUpdatePlacement"
        - $ref: "#/components/schemas/OpRemovePlacement"
        - $ref: "#/components/schemas/OpCreateShape"
        - $ref: "#/components/schemas/OpUpdateShape"
        - $ref: "#/components/schemas/OpDeleteShape"
        - $ref: "#/components/schemas/OpLinkOverride"
        - $ref: "#/components/schemas/OpLinkReset"
    CanvasOperationBatch:
      properties:
        operations:
          items:
            $ref: "#/components/schemas/CanvasOperation"
          maxItems: 500
          minItems: 1
          type: array
      required:
        - operations
      type: object
    CanvasOperationResult:
      properties:
        results:
          items:
            $ref: "#/components/schemas/CanvasOperationResultItem"
          type: array
        view:
          $ref: "#/components/schemas/CanvasView"
      required:
        - results
      type: object
    CanvasOperationResultItem:
      properties:
        clientId:
          type: string
        id:
          format: uuid
          type: string
        index:
          format: int64
          type: integer
        removedPlacementIds:
          items:
            format: uuid
            type: string
          type: array
      required:
        - index
      type: object
    CanvasPage:
      properties:
        items:
          items:
            $ref: "#/components/schemas/Canvas"
          type: array
      required:
        - items
      type: object
    CanvasSettings:
      additionalProperties: true
      properties:
        grid:
          default: true
          type: boolean
        hiddenLinkKinds:
          items:
            enum:
              - physical
              - logical
              - vpn_tunnel
              - proxy_route
              - dns_dependency
              - storage_mount
            type: string
          type: array
          uniqueItems: true
        showHealth:
          default: true
          type: boolean
        snap:
          default: 16
          minimum: 0
          type: integer
      type: object
    CanvasUpdate:
      minProperties: 1
      properties:
        description:
          type: string
        isProtected:
          type: boolean
        name:
          maxLength: 100
          minLength: 1
          type: string
        settings:
          additionalProperties: true
          properties:
            grid:
              default: true
              type: boolean
            hiddenLinkKinds:
              items:
                enum:
                  - physical
                  - logical
                  - vpn_tunnel
                  - proxy_route
                  - dns_dependency
                  - storage_mount
                type: string
              type: array
              uniqueItems: true
            showHealth:
              default: true
              type: boolean
            snap:
              default: 16
              minimum: 0
              type: integer
          type: object
        sortOrder:
          format: int32
          type: integer
        viewport:
          $ref: "#/components/schemas/CanvasViewport"
      type: object
    CanvasView:
      properties:
        areas:
          items:
            $ref: "#/components/schemas/Area"
          type: array
        breadcrumb:
          items:
            $ref: "#/components/schemas/BreadcrumbItem"
          type: array
        canvas:
          $ref: "#/components/schemas/Canvas"
        linkOverrides:
          items:
            $ref: "#/components/schemas/LinkOverride"
          type: array
        links:
          items:
            $ref: "#/components/schemas/Link"
          type: array
        nodes:
          items:
            $ref: "#/components/schemas/Node"
          type: array
        notes:
          items:
            $ref: "#/components/schemas/Note"
          type: array
        placements:
          items:
            $ref: "#/components/schemas/Placement"
          type: array
        shapes:
          items:
            $ref: "#/components/schemas/Shape"
          type: array
        viewer:
          $ref: "#/components/schemas/Viewer"
      required:
        - canvas
        - viewer
        - breadcrumb
        - placements
        - linkOverrides
        - nodes
        - links
        - areas
        - notes
        - shapes
      type: object
    CanvasViewport:
      properties:
        x:
          format: double
          type: number
        "y":
          format: double
          type: number
        zoom:
          exclusiveMinimum: 0
          format: double
          maximum: 8
          type: number
      required:
        - x
        - "y"
        - zoom
      type: object
    Event:
      properties:
        actorId:
          format: uuid
          type:
            - string
            - "null"
        canvasId:
          format: uuid
          type:
            - string
            - "null"
        data:
          additionalProperties: true
          type: object
        id:
          format: uuid
          type: string
        occurredAt:
          format: date-time
          type: string
        type:
          enum:
            - node.created
            - node.updated
            - node.deleted
            - link.created
            - link.updated
            - link.deleted
            - area.created
            - area.updated
            - area.deleted
            - note.created
            - note.updated
            - note.deleted
            - canvas.created
            - canvas.updated
            - canvas.deleted
            - canvas.operations_applied
            - health.changed
            - member.changed
          type: string
        workspaceId:
          format: uuid
          type: string
      required:
        - id
        - type
        - workspaceId
        - occurredAt
        - data
      type: object
    Field:
      properties:
        key:
          pattern: ^[a-z][a-z0-9_]{0,39}$
          type: string
        label:
          maxLength: 60
          type: string
        redacted:
          readOnly: true
          type: boolean
        sensitive:
          default: false
          type: boolean
        value:
          maxLength: 2000
          type:
            - string
            - "null"
      required:
        - key
        - label
      type: object
    Health:
      properties:
        checkedAt:
          format: date-time
          type:
            - string
            - "null"
        message:
          type:
            - string
            - "null"
        source:
          enum:
            - manual
            - plugin
          type: string
        status:
          enum:
            - healthy
            - degraded
            - down
            - unknown
          type: string
      required:
        - status
        - source
      type: object
    HealthSet:
      properties:
        message:
          maxLength: 500
          type: string
        status:
          enum:
            - healthy
            - degraded
            - down
            - unknown
          type: string
      required:
        - status
      type: object
    HealthStatus:
      enum:
        - healthy
        - degraded
        - down
        - unknown
      type: string
    Id:
      format: uuid
      type: string
    Identity:
      properties:
        createdAt:
          format: date-time
          type: string
        displayName:
          type:
            - string
            - "null"
        email:
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        lastUsedAt:
          format: date-time
          type:
            - string
            - "null"
        provider:
          enum:
            - google
            - discord
          type: string
      required:
        - id
        - provider
        - createdAt
      type: object
    InstanceRole:
      enum:
        - owner
        - admin
        - member
      type: string
    InstanceSettings:
      properties:
        oauthAutoLinkByEmail:
          default: true
          type: boolean
        sessionTtlHours:
          default: 168
          format: int64
          maximum: 8760
          minimum: 1
          type: integer
      type: object
    ItemRef:
      properties:
        id:
          format: uuid
          type: string
        type:
          enum:
            - node
            - area
            - note
          type: string
      required:
        - type
        - id
      type: object
    Link:
      properties:
        createdAt:
          format: date-time
          type: string
        directed:
          type: boolean
        health:
          $ref: "#/components/schemas/Health"
        id:
          format: uuid
          type: string
        kind:
          enum:
            - physical
            - vpn_tunnel
            - proxy_route
            - dns_dependency
            - storage_mount
            - logical
          type: string
        label:
          type: string
        properties:
          items:
            $ref: "#/components/schemas/Field"
          type: array
        sourceNodeId:
          format: uuid
          type: string
        sourcePort:
          type:
            - string
            - "null"
        targetNodeId:
          format: uuid
          type: string
        targetPort:
          type:
            - string
            - "null"
        updatedAt:
          format: date-time
          type: string
        version:
          $ref: "#/components/schemas/Version"
      required:
        - id
        - sourceNodeId
        - targetNodeId
        - kind
        - directed
        - label
        - properties
        - health
        - createdAt
        - updatedAt
        - version
      type: object
    LinkCreate:
      properties:
        directed:
          default: false
          type: boolean
        kind:
          enum:
            - physical
            - vpn_tunnel
            - proxy_route
            - dns_dependency
            - storage_mount
            - logical
          type: string
        label:
          type: string
        properties:
          items:
            $ref: "#/components/schemas/Field"
          type: array
        sourceNodeId:
          format: uuid
          type: string
        sourcePort:
          type: string
        targetNodeId:
          format: uuid
          type: string
        targetPort:
          type: string
      required:
        - sourceNodeId
        - targetNodeId
        - kind
      type: object
    LinkKind:
      enum:
        - physical
        - vpn_tunnel
        - proxy_route
        - dns_dependency
        - storage_mount
        - logical
      type: string
    LinkOverride:
      properties:
        hidden:
          type: boolean
        linkId:
          format: uuid
          type: string
        style:
          additionalProperties: {}
          type: object
        waypoints:
          items:
            $ref: "#/components/schemas/Point"
          type:
            - array
            - "null"
      required:
        - linkId
        - hidden
        - style
      type: object
    LinkPage:
      properties:
        items:
          items:
            $ref: "#/components/schemas/Link"
          type: array
        nextCursor:
          type:
            - string
            - "null"
      required:
        - items
      type: object
    LinkUpdate:
      minProperties: 1
      properties:
        directed:
          type: boolean
        kind:
          enum:
            - physical
            - vpn_tunnel
            - proxy_route
            - dns_dependency
            - storage_mount
            - logical
          type: string
        label:
          type: string
        properties:
          items:
            $ref: "#/components/schemas/Field"
          type: array
        sourcePort:
          type:
            - string
            - "null"
        targetPort:
          type:
            - string
            - "null"
      type: object
    ListMyIdentitiesOutputBody:
      properties:
        hasPassword:
          type: boolean
        items:
          items:
            $ref: "#/components/schemas/Identity"
          type: array
      required:
        - items
        - hasPassword
      type: object
    LoginRequest:
      properties:
        password:
          type: string
          writeOnly: true
        remember:
          default: false
          type: boolean
        username:
          type: string
      required:
        - username
        - password
      type: object
    Me:
      $ref: "#/components/schemas/Account"
    MeUpdate:
      minProperties: 1
      properties:
        displayName:
          maxLength: 100
          type: string
        email:
          format: email
          type:
            - string
            - "null"
      type: object
    Member:
      properties:
        canViewSensitive:
          type: boolean
        canvasIds:
          items:
            format: uuid
            type: string
          type: array
        createdAt:
          format: date-time
          type: string
        role:
          enum:
            - owner
            - admin
            - editor
            - viewer
          type: string
        user:
          $ref: "#/components/schemas/PublicUser"
      required:
        - user
        - role
      type: object
    MemberAdd:
      properties:
        canViewSensitive:
          default: false
          type: boolean
        canvasIds:
          items:
            format: uuid
            type: string
          type: array
        role:
          enum:
            - owner
            - admin
            - editor
            - viewer
          type: string
        userId:
          format: uuid
          type: string
      required:
        - userId
        - role
      type: object
    MemberPage:
      properties:
        items:
          items:
            $ref: "#/components/schemas/Member"
          type: array
      required:
        - items
      type: object
    MemberUpdate:
      minProperties: 1
      properties:
        canViewSensitive:
          type: boolean
        role:
          enum:
            - owner
            - admin
            - editor
            - viewer
          type: string
      type: object
    Membership:
      properties:
        canViewSensitive:
          type: boolean
        role:
          enum:
            - owner
            - admin
            - editor
            - viewer
          type: string
      required:
        - role
        - canViewSensitive
      type: object
    Node:
      properties:
        areaId:
          format: uuid
          type:
            - string
            - "null"
        category:
          enum:
            - network
            - compute
            - service
            - storage
            - external
            - generic
          type: string
        createdAt:
          format: date-time
          type: string
        createdBy:
          format: uuid
          type:
            - string
            - "null"
        description:
          type: string
        health:
          $ref: "#/components/schemas/Health"
        icon:
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        isProtected:
          type: boolean
        name:
