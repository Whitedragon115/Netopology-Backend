info:
  description: "Draw, understand and operate your whole infrastructure. Contract: api/contract.yaml."
  license:
    identifier: Apache-2.0
    name: Apache-2.0
  title: Netopology API
  version: 0.1.0-dev
openapi: 3.1.0
paths:
  /auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security: []
      summary: Sign in
      tags:
        - Setup & auth
      x-permission: auth.login
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Sign out (ends the current session)
      tags:
        - Setup & auth
      x-permission: auth.logout
  /auth/oauth/{provider}/callback:
    get:
      description: Signs in only if the identity is linked to an existing account, or if an account's email matches the provider-**verified** email and has no identity for this provider yet (it is then linked). Never creates an account. On failure redirects to the sign-in page with `?error=identity_not_linked` (or another `code`). Also completes `me.identity_link` flows.
      operationId: finishOAuthSignIn
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            enum:
              - google
              - discord
            type: string
        - explode: false
          in: query
          name: code
          schema:
            type: string
        - explode: false
          in: query
          name: state
          schema:
            type: string
        - explode: false
          in: query
          name: error
          schema:
            type: string
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security: []
      summary: Provider redirects back here
      tags:
        - Setup & auth
      x-permission: auth.oauth_callback
  /auth/oauth/{provider}/start:
    get:
      operationId: startOAuthSignIn
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            enum:
              - google
              - discord
            type: string
        - explode: false
          in: query
          name: returnTo
          schema:
            default: /
            type: string
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
