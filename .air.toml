# Live reload for `task dev`. Rebuilds and restarts the api when Go or SQL files change.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/netopology.exe ./cmd/netopology"
  entrypoint = ["./tmp/netopology.exe", "api"]
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "bin", "tools", "api", "docs", "sandbox"]
  exclude_regex = ["_test\\.go$"]
  delay = 300
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
