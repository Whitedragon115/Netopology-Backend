components:
  schemas:
    Account:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        displayName:
          type: string
        email:
          format: email
          type:
            - string
            - "null"
        hasPassword:
          type: boolean
        id:
          format: uuid
          type: string
        identities:
          description: Linked sign-in providers
          items:
            enum:
              - google
              - discord
            type: string
          type: array
        instanceRole:
          enum:
            - owner
            - admin
            - member
          type: string
        lastLoginAt:
          format: date-time
          type:
            - string
            - "null"
        status:
          enum:
            - active
            - disabled
          type: string
        updatedAt:
          format: date-time
          type: string
        username:
          type: string
      required:
        - id
        - username
        - displayName
        - instanceRole
        - hasPassword
        - identities
        - status
        - createdAt
        - updatedAt
      type: object
    AuthProviders:
      additionalProperties: false
      properties:
        password:
          type: boolean
        providers:
          items:
            $ref: "#/components/schemas/ProviderOption"
          type: array
      required:
        - password
        - providers
      type: object
    LoginRequest:
      additionalProperties: false
      properties:
        password:
          type: string
          writeOnly: true
        remember:
          default: false
          type: boolean
        username:
          type: string
      required:
        - username
        - password
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable reason
          type: string
        detail:
          type: string
        errors:
          description: Field-level validation errors
          items:
            $ref: "#/components/schemas/ProblemField"
          type: array
        instance:
          type: string
        status:
          format: int64
          type: integer
        title:
          type: string
        type:
          default: about:blank
          format: uri
          type: string
      required:
        - title
        - status
        - code
      type: object
    ProblemField:
      additionalProperties: false
      properties:
        location:
          type: string
        message:
          type: string
        value: {}
      required:
        - message
      type: object
    ProviderOption:
      additionalProperties: false
      properties:
        id:
          enum:
            - google
            - discord
          type: string
        name:
          type: string
      required:
        - id
        - name
      type: object
    SetupRequest:
      additionalProperties: false
      properties:
        displayName:
          maxLength: 100
          type: string
        email:
          format: email
          type: string
        password:
          maxLength: 256
          minLength: 12
          type: string
          writeOnly: true
        username:
          examples:
            - alice
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{1,38}[A-Za-z0-9]$
          type: string
        workspaceName:
          description: If set, also create this first workspace with you as owner
          maxLength: 100
          type: string
      required:
        - username
        - password
      type: object
    SetupStatus:
      additionalProperties: false
      properties:
        needsSetup:
          type: boolean
      required:
        - needsSetup
      type: object
  securitySchemes:
    guest:
      description: Set by `POST /share/{token}/unlock`. Valid for one share link only.
      in: cookie
      name: netopology_share
      type: apiKey
    session:
      description: Set by login/setup. HttpOnly, Secure, SameSite=Lax.
      in: cookie
      name: netopology_session
      type: apiKey
info:
  description: "Draw, understand and operate your whole infrastructure. Contract: api/contract.yaml."
  license:
    identifier: Apache-2.0
    name: Apache-2.0
  title: Netopology API
  version: 0.1.0-dev
openapi: 3.1.0
paths:
  /auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security: []
      summary: Sign in
      tags:
        - Setup & auth
      x-permission: auth.login
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Sign out (ends the current session)
      tags:
        - Setup & auth
      x-permission: auth.logout
  /auth/providers:
    get:
      description: Google and Discord appear only when the server has OAuth client credentials configured.
      operationId: listAuthProviders
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviders"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security: []
      summary: Which sign-in methods are enabled
      tags:
        - Setup & auth
      x-permission: auth.providers
  /me:
    get:
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Get the signed-in account
      tags:
        - Me
      x-permission: me.read
  /setup:
    get:
      operationId: getSetupStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security: []
      summary: Check whether first-run setup is needed
      tags:
        - Setup & auth
      x-permission: setup.status
    post:
      description: Only works while no account exists. Optionally creates the first workspace. Signs the new user in.
      operationId: completeSetup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: Created
          headers:
            Set-Cookie:
              schema:
                type: string
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security: []
      summary: Create the first account (becomes server owner)
      tags:
        - Setup & auth
      x-permission: setup.complete
security:
  - session: []
servers:
  - url: /api/v1
